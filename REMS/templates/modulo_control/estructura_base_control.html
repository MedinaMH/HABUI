{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block titulo %}Sistema REMS{% endblock %}</title>

<!-- Bootstrap local -->
<link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

<!-- Bootstrap Icons local -->
<link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">

<!-- Estilos personalizados -->
<link rel="stylesheet" href="{% static 'css/estilos_panel_rems.css' %}">

</head>

<body>
<!-- Header superior -->
<header class="navbar navbar-dark bg-primary fixed-top d-flex justify-content-between align-items-center px-3" style="height: 85px;">
    <a href="{% url 'control_inicial' %}" class="btn btn-outline-light d-flex align-items-center gap-2">
    <i class="bi bi-arrow-left-circle-fill fs-5"></i>
    <span class="d-none d-sm-inline">Control</span>
    </a>
    <div class="text-center flex-grow-1">
    <span class="encabezado">Sistema de control y administración</span>
    </div>
    <div style="width: 110px;"></div>

    <button 
    class="navbar-toggler d-md-none" 
    type="button" 
    data-bs-toggle="collapse" 
    data-bs-target="#sidebarMenu" 
    aria-controls="sidebarMenu" 
    aria-expanded="false" 
    aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
    </button>
</header>

<div class="container-fluid">
    <div class="row">
    <!-- Sidebar -->
    <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
        <div class="position-sticky pt-3">
        <ul class="nav flex-column">

            <!-- Alimentos -->
            <li class="nav-item">
            <a class="nav-link {% if request.path == '/control_alimentos' %}active{% endif %}" href="{% url 'control_alimentos' %}">
                <i class="bi bi-cup-straw me-2"></i>Alimentos
            </a>
            </li>

            <!-- Energía -->
            <li class="nav-item">
            <a class="nav-link {% if request.path == '/control_sensores' %}active{% endif %}"  href="{% url 'control_sensores' %}">
                <i class="bi bi-lightning-charge-fill me-2"></i>Sensores
            </a>
            </li>

        </ul>
        </div>
    </nav>

    <!-- Contenido -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-4">
        {% block contenido %}
        {% endblock %}
    </main>
    </div>
</div>

<footer class="text-center py-3 bg-light border-top mt-auto">
    <small>&copy; 2025 MACII CREDES</small>
</footer>

<!-- Bootstrap JS local (incluye Popper) -->
<script src="{% static 'js/bootstrap.bundle.js' %}"></script>
</body>
</html>
